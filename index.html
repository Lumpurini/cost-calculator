<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumpurini · Собівартість</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card { background: #fff; padding: 36px 32px; border-radius: 14px; box-shadow: 0 2px 20px rgba(0,0,0,0.10); width: 300px; text-align: center; }
    .title { font-weight: 600; font-size: 17px; margin-bottom: 20px; color: #3a2f28; }
    input { width: 100%; padding: 11px 13px; border: 1px solid #ddd; border-radius: 9px; font-size: 14px; box-sizing: border-box; margin-bottom: 12px; }
    input:focus { outline: none; border-color: #3a2f28; }
    button { width: 100%; padding: 11px 13px; border: none; border-radius: 9px; background: #3a2f28; color: #fff; font-size: 14px; cursor: pointer; }
    button:hover { background: #2a221c; }
    .error { color: #c0392b; font-size: 12px; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">Lumpurini &middot; Собівартість</div>
    <form id="gateForm">
      <input id="gateInput" type="password" placeholder="Пароль" autocomplete="off" autofocus>
      <button type="submit">Увійти</button>
      <div class="error" id="gateError">Невірний пароль</div>
    </form>
  </div>
  <script>
    (function () {
      var PASS = "Lumpurini2026!";
      var KEY = "lumpurini_gate_ok";
      try {
        if (sessionStorage.getItem(KEY) === "1") {
          location.replace("./app.html");
          return;
        }
      } catch (e) {}
      document.getElementById("gateForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var val = document.getElementById("gateInput").value;
        if (val === PASS) {
          try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
          location.href = "./app.html";
        } else {
          document.getElementById("gateError").style.display = "block";
        }
      });
    })();
  </script>
</body>
</html>
